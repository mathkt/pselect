<html lang="ko">

<style>
:root{--bg:#f4f6fb;--card:#fff;--ink:#1f2937;--sub:#6b7280;--line:#e5e7eb;--pri:#4f46e5;--pri2:#eef2ff;--ok:#059669;--okbg:#ecfdf5;--bad:#dc2626;--badbg:#fef2f2;--warn:#b45309;--warnbg:#fffbeb}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,"Malgun Gothic","Apple SD Gothic Neo",sans-serif;font-size:15px;line-height:1.5}
#app{max-width:980px;margin:0 auto;padding:16px}
h1{font-size:22px;margin:4px 0 12px}h2{font-size:17px;margin:0 0 10px}h3{font-size:15px;margin:0 0 8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.grow{flex:1}
input,select,textarea{font:inherit;padding:8px 10px;border:1px solid #cbd5e1;border-radius:8px;background:#fff;max-width:100%}
textarea{width:100%;min-height:110px}
button{font:inherit;padding:8px 14px;border:1px solid var(--pri);background:var(--pri);color:#fff;border-radius:8px;cursor:pointer}
button.sec{background:#fff;color:var(--pri)}
button.dan{background:#fff;color:var(--bad);border-color:var(--bad)}
button:disabled{opacity:.45;cursor:not-allowed}
button.sm{padding:4px 9px;font-size:13px}
.banner{border-radius:12px;padding:14px 16px;margin-bottom:14px;font-weight:600}
.b-on{background:var(--okbg);color:var(--ok);border:1px solid #a7f3d0}
.b-wait{background:var(--warnbg);color:var(--warn);border:1px solid #fde68a}
.b-off{background:#f3f4f6;color:var(--sub);border:1px solid var(--line)}
.items{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.item{border:1px solid var(--line);border-radius:10px;padding:10px;background:#fafafa}
.item.mine{border-color:var(--ok);background:var(--okbg)}
.item.sel{border-color:var(--pri);background:var(--pri2)}
.item.full{opacity:.55}
.stat{display:flex;gap:10px;font-size:13px;margin:4px 0 8px;flex-wrap:wrap}
.stat span{background:#fff;border:1px solid var(--line);border-radius:8px;padding:2px 8px}
.stat b{color:var(--pri)}
.tag{display:inline-block;font-size:12px;padding:2px 8px;border-radius:99px;background:var(--pri2);color:var(--pri);margin-left:6px}
.tag.ok{background:var(--okbg);color:var(--ok)}.tag.bad{background:var(--badbg);color:var(--bad)}.tag.warn{background:var(--warnbg);color:var(--warn)}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{border:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
th{background:#f9fafb}
.tabs{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.tabs button{background:#fff;color:var(--ink);border-color:var(--line)}
.tabs button.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.muted{color:var(--sub);font-size:13px}
.mini{font-size:12px}
.err{color:var(--bad);font-size:14px;min-height:20px}
.names{font-size:12px;color:var(--sub)}
.login{max-width:440px;margin:36px auto}
.res{padding:6px 10px;border-radius:8px;margin-top:6px;font-size:14px}
.res.ok{background:var(--okbg);color:var(--ok)}.res.bad{background:var(--badbg);color:var(--bad)}
</style>
</head>
<body>
<div id="app"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
/* =========================================================
   프로그램 신청 시스템 — 1버전 (보안 강화)
   - 링크만 있으면 입장, 학번/이름 직접 입력 (학생은 익명 로그인)
   - 교사는 구글 로그인 (보안 규칙에 등록된 계정만 설정·추첨·수정 가능)
   - 차수(1차, 2차…) 신청 → 교사가 [마감] → 자동 무작위 추첨 → 다음 차수
   - 학생 화면에는 항목별 신청 인원(숫자)과 '내 결과'만 보임 (다른 학생 정보는 안 보임)
   - 파일을 그냥 열면(file://) Firebase 없이 '연습 모드'로 동작
   ========================================================= */
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyD-ZvGW6vIKZPQeSVnTBxIvXyv-MCnaEo0",
  authDomain: "program-select.firebaseapp.com",
  databaseURL: "https://program-select-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "program-select",
  storageBucket: "program-select.firebasestorage.app",
  messagingSenderId: "27421754864",
  appId: "1:27421754864:web:da3b040080f4d58089c935"
};
const ADMIN_HINT = 'g*****@n*****';   // 로그인 화면에 보이는 안내용 문구 (실제 교사 이메일은 보안 규칙에만 있음)
const SCHOOL_DOMAIN = 'onchun.ms.kr';   // 학교 로그인 모드에서 허용할 이메일 도메인 (보안 규칙에도 같은 값이 있음)
const isSchoolEmail = e => !!e && String(e).toLowerCase().endsWith('@' + SCHOOL_DOMAIN);
const maskEmail = e => { const [u, d] = String(e || '').split('@'); return u && d ? u[0] + '*****@' + d[0] + '*****' : '(알 수 없음)'; };
/* 로그인한 구글 계정이 교사인지는 서버(보안 규칙)에 물어 확인: 교사만 'students' 전체를 읽을 수 있음 */
async function isTeacherSession(){
  try { await DB.get('students'); return true; } catch(e){ return false; }
}

/* ---------- 유틸 ---------- */
const $ = s => document.querySelector(s);
const arr = x => !x ? [] : Array.isArray(x) ? x.filter(v => v != null) : Object.values(x);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = p => p + Math.random().toString(36).slice(2, 8);
const clone = o => o == null ? o : JSON.parse(JSON.stringify(o));
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const sameName = (a, b) => String(a).replace(/\s+/g, '') === String(b).replace(/\s+/g, '');
const fmtTime = ms => { const d = new Date(ms), p = n => String(n).padStart(2, '0'); return `${d.getMonth()+1}/${d.getDate()} ${p(d.getHours())}:${p(d.getMinutes())}`; };
function authErrMsg(e){
  const c = (e && e.code) || '';
  if (c === 'auth/unauthorized-domain') return '이 주소(' + location.hostname + ')가 Firebase 승인 도메인에 없습니다. Authentication → 설정 → 승인된 도메인에 추가하세요.';
  if (c === 'auth/operation-not-allowed' || c === 'auth/admin-restricted-operation') return 'Firebase Authentication에서 해당 로그인 방법(구글/익명)이 꺼져 있습니다.';
  if (c === 'auth/popup-blocked') return '팝업이 차단되었습니다. 팝업을 허용하고 다시 시도하세요.';
  if (c === 'auth/popup-closed-by-user' || c === 'auth/cancelled-popup-request') return '로그인 창이 닫혔습니다.';
  if (c === 'auth/operation-not-supported-in-this-environment') return '이 환경(file://)에서는 로그인을 쓸 수 없습니다. 올려둔 주소로 접속하세요.';
  return '로그인 오류: ' + (c || (e && e.message) || e);
}

/* ---------- DB 어댑터 (Firebase / 연습 모드) ---------- */
const DB = (() => {
  let mode = 'local', fb = null, au = null;
  const LKEY = 'sel_v1_db', listeners = [];
  const lload = () => { try { return JSON.parse(localStorage.getItem(LKEY)) || {}; } catch(e){ return {}; } };
  const getp = (t, p) => p.split('/').filter(Boolean).reduce((o, k) => o == null ? null : o[k], t);
  function setp(t, p, v){
    const ks = p.split('/').filter(Boolean); let o = t;
    for (let i = 0; i < ks.length - 1; i++){ if (o[ks[i]] == null || typeof o[ks[i]] !== 'object') o[ks[i]] = {}; o = o[ks[i]]; }
    const last = ks[ks.length - 1];
    if (v === null || v === undefined) delete o[last]; else o[last] = v;
  }
  const fire = () => { const t = lload(); listeners.forEach(l => l.cb(clone(getp(t, l.path)))); };
  const lsave = t => { localStorage.setItem(LKEY, JSON.stringify(t)); fire(); };
  window.addEventListener('storage', e => { if (e.key === LKEY) fire(); });
  return {
    get mode(){ return mode; },
    init(cfg){
      if (cfg && cfg.apiKey && cfg.databaseURL && typeof firebase !== 'undefined' && typeof firebase.auth === 'function'){
        try { if (!firebase.apps.length) firebase.initializeApp(cfg); fb = firebase.database(); au = firebase.auth(); mode = 'firebase'; }
        catch(e){ console.error(e); mode = 'local'; }
      }
      return mode;
    },
    now: () => Date.now(),
    /* 인증 */
    authReady(){ if (mode !== 'firebase') return Promise.resolve(null); return new Promise(res => { const u = au.onAuthStateChanged(x => { u(); res(x); }); }); },
    user(){ return mode === 'firebase' ? au.currentUser : null; },
    uid(){ return mode === 'firebase' ? (au.currentUser && au.currentUser.uid) : 'local'; },
    async signInAnon(){ if (mode === 'firebase' && !au.currentUser) await au.signInAnonymously(); },
    async signInGoogle(hd){ const pv = new firebase.auth.GoogleAuthProvider(); pv.setCustomParameters(hd ? { hd, prompt: 'select_account' } : { prompt: 'select_account' }); const r = await au.signInWithPopup(pv); return r.user; },
    async signOut(){ if (mode === 'firebase') await au.signOut(); },
    /* 데이터 */
    async get(p){ if (mode === 'firebase') return (await fb.ref(p).get()).val(); return clone(getp(lload(), p)); },
    async set(p, v){ if (mode === 'firebase') return fb.ref(p).set(v === undefined ? null : v); const t = lload(); setp(t, p, v); lsave(t); },
    async update(base, obj){
      if (mode === 'firebase') return fb.ref(base).update(obj);
      const t = lload(); for (const k in obj) setp(t, base + '/' + k, obj[k]); lsave(t);
    },
    async tx(p, fn){
      if (mode === 'firebase'){
        const r = await fb.ref(p).transaction(c => fn(clone(c)));
        return { committed: r.committed, value: r.snapshot.val() };
      }
      const t = lload(); const cur = clone(getp(t, p)); const nv = fn(cur);
      if (nv === undefined) return { committed: false, value: cur };
      setp(t, p, nv); lsave(t); return { committed: true, value: nv };
    },
    on(p, cb, eb){
      if (mode === 'firebase'){
        const r = fb.ref(p);
        const h = r.on('value', s => cb(s.val()), e => { console.warn('읽기 거부:', p, e && e.code); if (eb) eb(e); });
        return () => r.off('value', h);
      }
      const l = { path: p, cb }; listeners.push(l); cb(clone(getp(lload(), p)));
      return () => { const i = listeners.indexOf(l); if (i >= 0) listeners.splice(i, 1); };
    }
  };
})();

/* ---------- 상태 ---------- */
const S = { cfg: null, assign: {}, state: {}, counts: {}, taken: {}, myResult: {}, log: {}, students: {}, apps: {}, myApps: {}, prevApps: {}, entryMode: 'free', gUser: null, sel: new Set(), me: null, admin: false, tab: 'status', view: 'entry', msg: '', D: null, q: '' };
let subs = [], roundSubs = {}, roundKey = '', kickedOnce = false;

function defaultConfig(){
  const it = (n, c) => ({ id: uid('i'), name: n, cap: c });
  return { title: '프로그램 신청', sectors: [
    { id: uid('s'), name: '1섹터', items: [it('항목 A', 3), it('항목 B', 3), it('항목 C', 2)] },
    { id: uid('s'), name: '2섹터', items: [it('항목 D', 3), it('항목 E', 2)] } ] };
}
const sectors = () => arr(S.cfg && S.cfg.sectors).map(s => ({ ...s, items: arr(s.items) }));
const curRound = () => Number(S.state.cur) || 1;
const members = (sid, iid) => Object.keys((S.assign[sid] || {})[iid] || {});                        // 교사 전용 (assign 전체)
const takenN = (sid, iid) => S.admin ? members(sid, iid).length : (((S.taken || {})[sid] || {})[iid] || 0);  // 학생은 인원수만
function findItem(sid, iid){ const s = sectors().find(x => x.id === sid); return s && s.items.find(i => i.id === iid); }
function myItem(sid, id){
  if (!S.admin) return ((S.myResult || {})[sid]) || null;     // 학생은 자기 결과만 가짐
  const a = S.assign[sid] || {}; for (const iid in a) if (a[iid] && a[iid][id]) return iid; return null;
}
const free = (sid, it) => Math.max(0, Number(it.cap) - takenN(sid, it.id));
const nameOf = id => (S.students[id] && S.students[id].name) || id;

/* ---------- 배정 (교사만 실행) ---------- */
async function assignTx(sid, iid, id, force){
  const it = findItem(sid, iid); if (!it) return { ok: false, reason: 'noitem' };
  let reason = null;
  const r = await DB.tx('assign/' + sid, cur => {
    cur = cur || {}; reason = null;
    for (const k in cur) if (cur[k] && cur[k][id]){ reason = 'already'; return; }
    const m = cur[iid] || {};
    if (!force && Object.keys(m).length >= Number(it.cap)){ reason = 'full'; return; }
    m[id] = DB.now(); cur[iid] = m; return cur;
  });
  return r.committed ? { ok: true } : { ok: false, reason: reason || 'full' };
}
async function unassign(sid, id){
  await DB.tx('assign/' + sid, cur => { cur = cur || {}; for (const k in cur) if (cur[k]) delete cur[k][id]; return cur; });
}
/* 학생에게 공개되는 요약본: 항목별 인원수(taken) + 학생별 자기 결과(result) — assign 변경 뒤에 호출 */
async function publish(){
  const assign = (await DB.get('assign')) || {}, taken = {}, result = {};
  for (const sid in assign) for (const iid in (assign[sid] || {})){
    const ids = Object.keys(assign[sid][iid] || {}); if (!ids.length) continue;
    (taken[sid] = taken[sid] || {})[iid] = ids.length;
    ids.forEach(id => { (result[id] = result[id] || {})[sid] = iid; });
  }
  await DB.set('taken', Object.keys(taken).length ? taken : null);
  await DB.set('result', Object.keys(result).length ? result : null);
}
const cntPath = (r, sid, iid) => `counts/${r}/${sid}/${iid}`;
async function recomputeCounts(r){
  const apps = (await DB.get('apps/' + r)) || {}, studs = (await DB.get('students')) || {}, c = {};
  for (const id in apps){ if (!studs[id]) continue; const v = apps[id] || {}; for (const sid in v){ c[sid] = c[sid] || {}; c[sid][v[sid]] = (c[sid][v[sid]] || 0) + 1; } }
  await DB.set('counts/' + r, Object.keys(c).length ? c : null);
}
const setCur = r => DB.update('state', { cur: r, ck: String(r) });

/* ---------- 신청 / 취소 ---------- */
async function applyFor(id, sid, iid, cancel){
  const r = curRound();
  if (S.state.locked) return { ok: false, msg: '추첨 처리 중입니다. 잠시 후 다시 시도하세요.' };
  if (S.state.ended) return { ok: false, msg: '신청이 종료되었습니다.' };
  if (!cancel){
    if (myItem(sid, id)) return { ok: false, msg: '이미 이 섹터는 배정되었습니다.' };
    const it = findItem(sid, iid); if (!it) return { ok: false, msg: '없는 항목입니다.' };
    if (free(sid, it) <= 0) return { ok: false, msg: '정원이 모두 찬 항목입니다.' };
  }
  const path = `apps/${r}/${id}/${sid}`;
  try {
    const old = await DB.get(path);
    if (!cancel && old === iid) return { ok: true };
    if (cancel && !old) return { ok: true };
    if (old) await DB.tx(cntPath(r, sid, old), c => Math.max(0, (c || 0) - 1) || null);
    if (cancel){ await DB.set(path, null); return { ok: true }; }
    await DB.set(path, iid);
    await DB.tx(cntPath(r, sid, iid), c => (c || 0) + 1);
    return { ok: true };
  } catch(e){
    console.warn(e);
    return { ok: false, msg: (e && e.code === 'PERMISSION_DENIED') ? '지금은 신청할 수 없습니다. (마감되었거나 처리 중입니다) 화면을 새로고침해 보세요.' : '신청 중 오류가 났습니다. 잠시 후 다시 시도하세요.' };
  }
}

/* ---------- 마감 + 자동 추첨 (교사) ---------- */
async function closeRound(){
  const r = curRound();
  if (!confirm(`${r}차를 마감하고 무작위 추첨을 실행합니다.\n\n정원 이하인 항목은 신청자 전원이 확정되고, 정원을 넘는 항목은 무작위로 뽑힙니다.\n계속할까요?`)) return;
  const c = await DB.tx('state/locked', x => x ? undefined : true);
  if (!c.committed) return alert('이미 처리 중입니다. 잠겨 있다면 [잠금 해제]를 눌러주세요.');
  try {
    const apps = (await DB.get('apps/' + r)) || {}, studs = (await DB.get('students')) || {}, assign = (await DB.get('assign')) || {};
    const groups = {};
    for (const id in apps){
      if (!studs[id]) continue; const v = apps[id] || {};
      for (const sid in v){
        if (assign[sid] && Object.values(assign[sid]).some(m => m && m[id])) continue;
        (groups[sid + '|' + v[sid]] = groups[sid + '|' + v[sid]] || []).push(id);
      }
    }
    const rows = [], winners = [];
    for (const g in groups){
      const [sid, iid] = g.split('|'); const it = findItem(sid, iid); if (!it) continue;
      const have = Object.keys(((assign[sid] || {})[iid]) || {}).length;
      const fr = Math.max(0, Number(it.cap) - have), list = groups[g];
      const sh = shuffle(list); const win = sh.slice(0, fr), lose = sh.slice(fr), ok = [];
      for (const id of win){ const x = await assignTx(sid, iid, id); if (x.ok){ ok.push(id); winners.push({ sid, iid, id }); } else lose.push(id); }
      rows.push({ sid, iid, item: it.name, applicants: list.length, cap: it.cap, free: fr, win: ok.map(i => studs[i].name + '(' + i + ')'), lose: lose.map(i => studs[i].name + '(' + i + ')') });
    }
    await DB.set('log/' + r, { time: Date.now(), rows, winners });
    await publish();
    await setCur(r + 1);
  } catch(e){ console.error(e); alert('추첨 중 오류: ' + e.message); }
  finally { await DB.set('state/locked', null); }
}
async function undoRound(){
  const r = curRound() - 1; if (r < 1) return alert('취소할 마감이 없습니다.');
  const log = (S.log || {})[r]; if (!log) return alert('마감 기록이 없습니다.');
  if (!confirm(`${r}차 마감을 취소합니다.\n${r}차 추첨으로 확정된 배정이 모두 풀리고, ${r}차 신청이 다시 열립니다. 계속할까요?`)) return;
  await DB.set('state/locked', true);
  try {
    for (const w of arr(log.winners)) await unassign(w.sid, w.id);
    await DB.set('apps/' + (r + 1), null); await DB.set('counts/' + (r + 1), null);
    await DB.set('log/' + r, null); await DB.set('state/ended', null);
    await recomputeCounts(r); await publish(); await setCur(r);
  } finally { await DB.set('state/locked', null); }
}

/* ---------- 구독 ---------- */
function stopSubs(){ subs.forEach(u => u()); subs = []; Object.values(roundSubs).forEach(u => u()); roundSubs = {}; roundKey = ''; }
function startSubs(){
  stopSubs();
  subs.push(DB.on('config', v => { S.cfg = v; onData(); }));
  subs.push(DB.on('entryMode', v => {
    S.entryMode = v === 'school' ? 'school' : 'free';
    if (!S.admin && S.me && DB.mode === 'firebase' && S.entryMode === 'school'){ const cu = DB.user(); if (cu && cu.isAnonymous && !kickedOnce){ kickedOnce = true; alert('입장 방식이 학교 구글 로그인으로 바뀌었습니다. 학교 계정으로 다시 로그인해주세요.'); return leave(); } }
    if (S.admin && S.tab === 'config') renderAdmin(); else onData();
  }));
  if (S.admin){
    subs.push(DB.on('assign', v => { S.assign = v || {}; onData(); }));
    subs.push(DB.on('state', v => { S.state = v || {}; onData(); }));
    subs.push(DB.on('students', v => { S.students = v || {}; onData(); }));
    subs.push(DB.on('apps', v => { S.apps = v || {}; onData(); }));
    subs.push(DB.on('log', v => { S.log = v || {}; onData(); }));
  } else if (S.me){
    S.state = {}; S.taken = {}; S.myResult = {}; S.assign = {}; S.students = {}; S.apps = {}; S.log = {};
    subs.push(DB.on('taken', v => { S.taken = v || {}; onData(); }));
    ['cur', 'locked', 'ended'].forEach(k => subs.push(DB.on('state/' + k, v => {
      if (v == null) delete S.state[k]; else S.state[k] = v;
      if (k === 'cur') ensureRoundSubs();
      onData();
    })));
    subs.push(DB.on('result/' + S.me.id, v => { S.myResult = v || {}; onData(); }));
    subs.push(DB.on('students/' + S.me.id, v => { if (!v) kicked(); else { S.me = { id: v.id, name: v.name }; onData(); } }, () => kicked()));
    ensureRoundSubs();
  }
}
function kicked(){
  if (kickedOnce || S.view !== 'student') return; kickedOnce = true;
  alert('교사가 학생 정보를 바꾸거나 삭제했습니다. 다시 입장해주세요.'); leave();
}
function ensureRoundSubs(){
  if (S.admin || !S.me) return;
  const r = curRound(), k = S.me.id + ':' + r; if (k === roundKey) return; roundKey = k;
  Object.values(roundSubs).forEach(u => u()); roundSubs = {};
  S.counts = {}; S.myApps = {}; S.prevApps = {};
  roundSubs.c = DB.on('counts/' + r, v => { S.counts = v || {}; onData(); });
  roundSubs.a = DB.on(`apps/${r}/${S.me.id}`, v => { S.myApps = v || {}; onData(); });
  if (r > 1) roundSubs.p = DB.on(`apps/${r - 1}/${S.me.id}`, v => { S.prevApps = v || {}; onData(); });
}
let rt = 0;
function onData(){
  cancelAnimationFrame(rt);
  rt = requestAnimationFrame(() => {
    if (S.view === 'student') renderStudent();
    else if (S.view === 'admin'){
      const ae = document.activeElement;
      if (S.tab === 'config') return;
      if (ae && (ae.id === 'q' || (ae.classList && ae.classList.contains('keep')))) return;
      renderAdmin();
    }
  });
}

async function schoolCancel(){ S.gUser = null; S.msg = ''; try { await DB.signOut(); } catch(e){} await ensureAnon(); renderEntry(); }
async function schoolLogin(){
  S.msg = '';
  try {
    const u = await DB.signInGoogle(SCHOOL_DOMAIN);
    if (!isSchoolEmail(u.email) || !u.emailVerified){
      const em = u.email; await DB.signOut(); await ensureAnon();
      S.msg = `학교 계정(@${SCHOOL_DOMAIN})만 사용할 수 있습니다. (선택한 계정: ${maskEmail(em)})`; return renderEntry();
    }
    S.gUser = { email: u.email, uid: u.uid };
    const sid = await DB.get('acct/' + u.uid);            // 이미 학번이 연결된 계정이면 바로 입장
    if (sid){
      const st = await DB.get('students/' + sid);
      if (st){ S.me = { id: st.id, name: st.name }; S.gUser = null; localStorage.setItem('sel_v1_me', JSON.stringify(S.me)); return enterStudent(); }
    }
    renderEntry();
  } catch(e){ S.msg = authErrMsg(e); renderEntry(); }
}
async function enterSchool(){
  const id = $('#sid').value.trim(), name = $('#sname').value.trim();
  if (!/^\d{1,10}$/.test(id)){ S.msg = '학번은 숫자로 입력하세요.'; return renderEntry(); }
  if (!name || name.length > 20){ S.msg = '이름을 입력하세요.'; return renderEntry(); }
  const u = DB.user();
  if (!u || u.isAnonymous || !isSchoolEmail(u.email)){ S.gUser = null; S.msg = '로그인이 풀렸습니다. 다시 로그인하세요.'; return renderEntry(); }
  const rec = { id, name, uid: u.uid, email: u.email, joined: Date.now() };
  try {
    await DB.update('', { ['acct/' + u.uid]: id, ['students/' + id]: rec });   // 계정↔학번 연결과 학생 등록을 한 번에
  } catch(e){
    S.msg = (e && e.code === 'PERMISSION_DENIED')
      ? `입장할 수 없습니다. 학번 ${id}번이 이미 다른 계정에 연결되어 있거나, 이름이 다르거나, 이 계정이 이미 다른 학번에 연결되어 있습니다. 확인 후 안 되면 선생님께 말씀드리세요.`
      : '입장 중 오류: ' + (e.message || e);
    return renderEntry();
  }
  S.me = { id, name }; S.gUser = null; S.msg = '';
  localStorage.setItem('sel_v1_me', JSON.stringify(S.me));
  enterStudent();
}
async function ensureAnon(){
  try { await DB.signInAnon(); return true; }
  catch(e){ S.msg = authErrMsg(e); return false; }
}
async function enter(){
  const id = $('#sid').value.trim(), name = $('#sname').value.trim();
  if (!/^\d{1,10}$/.test(id)){ S.msg = '학번은 숫자로 입력하세요.'; return renderEntry(); }
  if (!name || name.length > 20){ S.msg = '이름을 입력하세요.'; return renderEntry(); }
  if (!(await ensureAnon())) return renderEntry();
  const mismatch = `학번 ${id}번은 다른 이름으로 이미 등록되어 있습니다. 학번과 이름을 다시 확인하세요. 이름이 맞는데도 안 되면 선생님께 말씀드리세요.`;
  const rec = { id, name, uid: DB.uid(), joined: Date.now() };
  try {
    if (DB.mode === 'local'){
      const ex = await DB.get('students/' + id);
      if (ex && !sameName(ex.name, name)){ S.msg = mismatch; return renderEntry(); }
      if (ex) rec.joined = ex.joined || rec.joined;
    }
    await DB.set('students/' + id, rec);   // 같은 학번+같은 이름이면 허용(다른 기기에서 재입장), 이름이 다르면 보안 규칙이 거부
  } catch(e){
    S.msg = (e && e.code === 'PERMISSION_DENIED') ? mismatch : '입장 중 오류: ' + (e.message || e);
    return renderEntry();
  }
  S.me = { id, name }; S.msg = '';
  localStorage.setItem('sel_v1_me', JSON.stringify(S.me));
  enterStudent();
}
function enterStudent(){ S.view = 'student'; S.admin = false; kickedOnce = false; S.myApps = {}; S.prevApps = {}; S.counts = {}; startSubs(); renderStudent(); }
async function leave(){
  const wasAdmin = S.admin;
  localStorage.removeItem('sel_v1_me'); sessionStorage.removeItem('sel_v1_admin');
  S.me = null; S.admin = false; stopSubs(); S.msg = ''; S.view = 'entry';

function renderStudent(){
  if (!S.me) return;
  if (!S.cfg){ $('#app').innerHTML = '<div class="card">아직 교사가 설정을 마치지 않았습니다. 잠시 후 다시 확인하세요.</div>'; return; }
  const r = curRound(), secs = sectors(), id = S.me.id, ended = S.state.ended, locked = S.state.locked;
  const done = secs.filter(s => myItem(s.id, id)).length, left = secs.length - done;
  let bn;
  if (ended) bn = ['b-off', '신청이 종료되었습니다. 아래에서 내 결과를 확인하세요.'];
  else if (locked) bn = ['b-wait', `${r}차 추첨 중… 잠시만 기다려주세요.`];
  else if (left === 0) bn = ['b-on', '모든 섹터에 배정되었습니다. 🎉'];
  else bn = ['b-on', `${r}차 신청 중 — 교사가 마감하면 자동으로 추첨됩니다.<br><span class="mini" style="font-weight:400">배정이 안 된 섹터 ${left}개에서 항목을 하나씩 고르세요. 신청은 마감 전까지 바꿀 수 있습니다.</span>`];
  let h = `<div class="row"><h1 class="grow">${esc(S.cfg.title)}</h1><span class="muted">${esc(id)} ${esc(S.me.name)}</span><button class="sec sm" onclick="leave()">나가기</button></div>
    <div class="banner ${bn[0]}">${bn[1]}</div>`;
  if (r > 1 && !ended){
    const lost = secs.filter(s => !myItem(s.id, id) && (S.prevApps || {})[s.id]);
    if (lost.length) h += `<div class="card"><b>${r - 1}차 결과</b>${lost.map(s => `<div class="res bad">${esc(s.name)}: 이번에는 뽑히지 않았어요. ${r}차에서 다시 신청하세요.</div>`).join('')}</div>`;
  }
  h += `<div class="card"><b>내 배정</b> <span class="tag ${left === 0 ? 'ok' : ''}">${done}/${secs.length}</span>
    <div style="margin-top:6px">${secs.map(s => { const i = myItem(s.id, id), it = i && findItem(s.id, i); return `<div>${esc(s.name)} : ${it ? '<b>' + esc(it.name) + '</b>' : '<span class="muted">미배정</span>'}</div>`; }).join('')}</div></div>`;
  secs.forEach(s => {
    const mine = myItem(s.id, id), picked = (S.myApps || {})[s.id];
    h += `<div class="card"><h2>${esc(s.name)} ${mine ? '<span class="tag ok">배정 완료</span>' : ''}</h2><div class="items">`;
    s.items.forEach(it => {
      const have = takenN(s.id, it.id), cap = Number(it.cap), fr = Math.max(0, cap - have);
      const applied = ((S.counts[s.id] || {})[it.id]) || 0;
      const isMine = mine === it.id, sel = !mine && picked === it.id, comp = applied > fr && fr > 0;
      let btn = '';
      if (!mine && !ended){
        if (sel) btn = `<button class="sm dan" ${locked ? 'disabled' : ''} onclick="doApply('${s.id}','${it.id}',true)">신청 취소</button>`;
        else btn = `<button class="sm" ${(fr <= 0 || locked) ? 'disabled' : ''} onclick="doApply('${s.id}','${it.id}')">${fr <= 0 ? '정원 마감' : '신청'}</button>`;
      }
      h += `<div class="item ${isMine ? 'mine' : ''} ${sel ? 'sel' : ''} ${fr <= 0 && !isMine ? 'full' : ''}">
        <b>${esc(it.name)}</b>${isMine ? '<span class="tag ok">내 선택</span>' : ''}${sel ? '<span class="tag">신청함</span>' : ''}
        <div class="stat"><span>정원 <b>${cap}</b></span><span>남은 자리 <b>${fr}</b></span><span>${r}차 신청 <b>${applied}</b>명</span></div>
        ${comp ? '<div class="mini"><span class="tag warn" style="margin:0">경쟁 중</span> 신청자가 남은 자리보다 많아요</div>' : ''}
        <div style="margin-top:6px">${btn}</div></div>`;
    });
    h += '</div></div>';
  });
  $('#app').innerHTML = h;
}

  const x = await applyFor(S.me.id, sid, iid, cancel); if (!x.ok) alert(x.msg);

async function editStudent(id){
  const st = S.students[id]; if (!st) return;
  const nn = prompt('이름 수정', st.name); if (nn === null) return;
  const ni = prompt('학번 수정 (숫자)', id); if (ni === null) return;
  const name = nn.trim(), nid = ni.trim();
  if (!name || !/^\d{1,10}$/.test(nid)) return alert('이름과 숫자 학번을 확인하세요.');
  if (nid === id){ await DB.update('students/' + id, { name }); return; }
  if (S.students[nid]) return alert(`학번 ${nid}번은 이미 있습니다 (${S.students[nid].name}).`);
  await DB.set('students/' + nid, { ...st, id: nid, name }); await DB.set('students/' + id, null);
  if (st.email && st.uid) await DB.set('acct/' + st.uid, nid);
  for (const s of sectors()){
    await DB.tx('assign/' + s.id, cur => { cur = cur || {}; for (const k in cur) if (cur[k] && cur[k][id] != null){ cur[k][nid] = cur[k][id]; delete cur[k][id]; } return cur; });
  }
  const apps = (await DB.get('apps')) || {};
  for (const r in apps){ if (apps[r] && apps[r][id]){ await DB.set(`apps/${r}/${nid}`, apps[r][id]); await DB.set(`apps/${r}/${id}`, null); } }
  await publish();
}

async function delSelected(){
  const ids = [...S.sel].filter(i => S.students[i]); if (!ids.length) return;

  const set = new Set(ids), o = {};
  for (const s of sectors()){

  }

  for (const r in apps) for (const i of set) if (apps[r] && apps[r][i]) o[`apps/${r}/${i}`] = null;

async function addStudents(list){
  const o = {}, dup = [], bad = [];
  for (const [id, name] of list){
    if (!/^\d{1,10}$/.test(id) || !name || name.length > 20){ bad.push(`${id} ${name}`); continue; }
    if (S.students[id] || o['students/' + id]){ dup.push(id); continue; }
    o['students/' + id] = { id, name, uid: 'teacher', added: true, joined: Date.now() };
  }
  const n = Object.keys(o).length; if (n) await DB.update('', o);
  alert(`${n}명 추가했습니다.` + (dup.length ? `\n이미 있는 학번(건너뜀): ${dup.join(', ')}` : '') + (bad.length ? `\n형식 오류(건너뜀): ${bad.join(' / ')}` : ''));
  return n;
}

function cfgTemplate(){
  const rows = [['섹터', '항목', '정원'], ['1섹터', '항목 A', 3], ['1섹터', '항목 B', 3], ['2섹터', '항목 C', 2], ['2섹터', '항목 D', 2]];

async function cfgUpload(inp){
  const f = inp.files && inp.files[0]; if (!f) return; inp.value = '';
  try {
    const wb = XLSX.read(await f.arrayBuffer(), { type: 'array' });
    const rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { header: 1, defval: '' });
    const old = sectors(), secs = [], errs = []; let last = null, n = 0;
    rows.forEach((r, ri) => {
      const a = String(r[0] == null ? '' : r[0]).trim(), b = String(r[1] == null ? '' : r[1]).trim(), c = r[2];
      if (!a && !b && (c === '' || c == null)) return;
      if (ri === 0 && (/섹터/.test(a) || /항목/.test(b)) && !(Number(c) >= 1)) return;   // 제목 줄
      const sn = a || last; if (!sn || !b){ errs.push(`${ri + 1}행: 섹터·항목 이름이 비어 있음`); return; }
      const cap = Math.floor(Number(c)); if (!(cap >= 1)){ errs.push(`${ri + 1}행: 정원은 1 이상의 숫자여야 함`); return; }
      last = sn;
      let sec = secs.find(x => x.name === sn);
      if (!sec){ const o = old.find(x => x.name === sn); sec = { id: o ? o.id : uid('s'), name: sn, items: [] }; secs.push(sec); }
      if (sec.items.some(x => x.name === b)){ errs.push(`${ri + 1}행: ${sn}/${b} 중복`); return; }
      const os = old.find(x => x.name === sn), oi = os && os.items.find(x => x.name === b);
      sec.items.push({ id: oi ? oi.id : uid('i'), name: b, cap }); n++;
    });
    if (!secs.length) return alert('읽을 수 있는 줄이 없습니다. 양식(섹터 | 항목 | 정원)을 확인하세요.' + (errs.length ? '\n' + errs.slice(0, 5).join('\n') : ''));
    S.D = S.D || clone(S.cfg || defaultConfig()); S.D.sectors = secs; renderAdmin();
    alert(`섹터 ${secs.length}개, 항목 ${n}개를 불러왔습니다.\n내용을 확인하고 맨 아래 [설정 저장]을 누르세요.` + (errs.length ? `\n\n건너뛴 줄 ${errs.length}개:\n` + errs.slice(0, 8).join('\n') : ''));
  } catch(e){ alert('엑셀을 읽지 못했습니다: ' + (e.message || e)); }
}
async function cfgSave(){

async function manualAssign(){
  const id = $('#mk').value.trim(); if (!S.students[id]) return alert('입장한 학생의 학번이 아닙니다.');
  const x = await assignTx($('#msec').value, $('#mit').value, id, true);
  if (x.ok) await publish();
  alert(x.ok ? '배정했습니다.' : '이미 이 섹터에 배정되어 있습니다. 먼저 제거하세요.');
}
async function manualRemove(){ const id = $('#mk').value.trim(); if (!id) return alert('학번을 입력하세요.'); await unassign($('#msec').value, id); await publish(); alert('제거했습니다.'); }
async function resetAll(){
  if (!confirm('입장한 학생, 배정, 신청, 추첨 기록을 모두 지우고 1차부터 다시 시작합니다. (설정은 유지) 계속할까요?')) return;
  for (const p of ['students', 'assign', 'apps', 'counts', 'state', 'log', 'taken', 'result']) await DB.set(p, null);
  alert('초기화했습니다.');
}
function exportXlsx(){
  if (typeof XLSX === 'undefined') return alert('엑셀 라이브러리를 불러오지 못했습니다.');
  const secs = sectors(), ids = Object.keys(S.students).sort((a, b) => a.localeCompare(b, undefined, { numeric: true }));
  const a = [['학번', '이름', ...secs.map(s => s.name)]];
  ids.forEach(i => a.push([i, nameOf(i), ...secs.map(s => { const it = myItem(s.id, i); return it ? findItem(s.id, it).name : '미배정'; })]));
  const b = [['섹터', '항목', '정원', '인원', '명단']];
  secs.forEach(s => s.items.forEach(it => { const m = members(s.id, it.id); b.push([s.name, it.name, it.cap, m.length, m.map(i => nameOf(i) + '(' + i + ')').join(', ')]); }));
  const c = [['학번', '이름', '미배정 섹터']];
  ids.forEach(i => { const un = secs.filter(s => !myItem(s.id, i)).map(s => s.name); if (un.length) c.push([i, nameOf(i), un.join(', ')]); });
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(a), '학생별');
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(b), '항목별');
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(c), '미배정');
  XLSX.writeFile(wb, '배정결과.xlsx');
}
async function simCreate(){
  const n = Number($('#sn').value) || 200, up = {};
  for (let i = 1; i <= n; i++){ const id = '9' + String(i).padStart(4, '0'); up[id] = { id, name: '가상' + i, uid: 'test', test: true, joined: Date.now() }; }
  await DB.update('students', up); alert(n + '명 생성');
}
async function simApply(){
  const test = Object.keys(S.students).filter(k => S.students[k].test), secs = sectors();
  if (!test.length) return alert('가상 학생이 없습니다.');
  const pick = a => a[Math.floor(Math.random() * a.length)]; let ok = 0;
  for (const id of test) for (const s of secs){
    if (myItem(s.id, id)) continue;
    const its = s.items.filter(it => free(s.id, it) > 0); if (!its.length) continue;
    const x = await applyFor(id, s.id, pick(its).id); if (x.ok) ok++;
  }
  alert('가상 신청 ' + ok + '건');
}
async function simClear(){
  const test = Object.keys(S.students).filter(k => S.students[k].test); if (!test.length) return alert('가상 학생이 없습니다.');
  if (!confirm(test.length + '명의 가상 학생과 그 배정·신청을 삭제할까요?')) return;
  for (const s of sectors()) await DB.tx('assign/' + s.id, cur => { cur = cur || {}; for (const i in cur) test.forEach(k => { if (cur[i]) delete cur[i][k]; }); return cur; });
  const apps = (await DB.get('apps')) || {};
  for (const r in apps){ const u = {}; test.forEach(k => u[k] = null); await DB.update('apps/' + r, u); }
  const u = {}; test.forEach(k => u[k] = null); await DB.update('students', u);
  for (const r in apps) await recomputeCounts(r);
  await publish();
  alert('삭제했습니다.');
}

/* ---------- 시작 ---------- */
function initPublic(){
  stopSubs(); S.admin = false; S.view = 'entry';
  subs.push(DB.on('config', v => { S.cfg = v; if (S.view === 'entry'){ const e = $('#sid'), n = $('#sname'); if (!e || (!e.value && !(n && n.value))) renderEntry(); } }));
  subs.push(DB.on('entryMode', v => { const m = v === 'school' ? 'school' : 'free'; if (m !== S.entryMode){ S.entryMode = m; if (S.view === 'entry') renderEntry(); } }));
  renderEntry();
}
async function boot(){
  let cfg = FIREBASE_CONFIG;
  if (location.protocol === 'file:') cfg = null;   // 파일을 그냥 열면 연습 모드 (로그인 기능은 웹 주소에서만 가능)
  DB.init(cfg);
  const flag = sessionStorage.getItem('sel_v1_admin');
  if (DB.mode === 'firebase'){
    try { await DB.authReady(); } catch(e){}
    const u = DB.user();
    if (flag && u && !u.isAnonymous && (await isTeacherSession())) return enterAdmin();
    sessionStorage.removeItem('sel_v1_admin');
    if (u && !u.isAnonymous && isSchoolEmail(u.email) && u.emailVerified){
      /* 학교 계정으로 로그인해 둔 학생: 연결된 학번이 있으면 바로 입장 */
      try {
        const sid = await DB.get('acct/' + u.uid), st = sid && await DB.get('students/' + sid);
        if (st){ S.me = { id: st.id, name: st.name }; return enterStudent(); }
      } catch(e){}
      try { await DB.signOut(); } catch(e){}
    } else if (u && !u.isAnonymous){ try { await DB.signOut(); } catch(e){} }   // 교사 로그인이 남아 있으면 학생 모드로 돌릴 때 정리
    await ensureAnon();
  } else if (flag) return enterAdmin();
  let me = null; try { me = JSON.parse(localStorage.getItem('sel_v1_me')); } catch(e){}
  if (me && DB.mode === 'firebase'){   // 학교 로그인 모드인데 익명(자유 입력)으로 들어왔던 기기는 다시 로그인하게 함
    try { const m = await DB.get('entryMode'); if (m === 'school'){ const cu = DB.user(); if (!cu || cu.isAnonymous){ me = null; localStorage.removeItem('sel_v1_me'); } } } catch(e){}
  }
  if (me && me.id){
    try {
      const st = await DB.get('students/' + me.id);
      if (st){ S.me = { id: st.id, name: st.name }; return enterStudent(); }
    } catch(e){ /* 다른 기기/삭제 등으로 내 기록을 읽을 수 없으면 다시 입장 */ }
    localStorage.removeItem('sel_v1_me');
  }
  initPublic();
}
boot();
